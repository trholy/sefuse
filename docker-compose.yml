services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sefuse_qdrant
    expose:
      - "6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  postgres:
    build: ./postgres
    container_name: sefuse_postgres
    expose:
      - "5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          memory: 512M
          cpus: "1"

  ollama:
    build: ./ollama
    container_name: sefuse_ollama
    expose:
      - "11434"
    volumes:
      - ./ollama/data:/home/ollama/.ollama
    # ------------------------------
    # Uncomment NVIDIA_VISIBLE_DEVICES, NVIDIA_DRIVER_CAPABILITIES,
    # OLLAMA_NUM_CTX & gpus to use GPU for embedding processing.
    # ------------------------------
    environment:
      - MODEL=${MODEL:-bge-m3}
      - OLLAMA_READY_TIMEOUT=${OLLAMA_READY_TIMEOUT:-60}
      - OLLAMA_KEEP_ALIVE=-1
     # - NVIDIA_VISIBLE_DEVICES=all
     # - NVIDIA_DRIVER_CAPABILITIES=compute,utility
     # - OLLAMA_NUM_CTX=2048
   # gpus:
      # - driver: nvidia
        # device_ids: ["0"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
      - egress
    security_opt:
      - no-new-privileges:true
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  fastapi:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    container_name: sefuse_fastapi
    expose:
      - "8000"
    volumes:
      - ./data/funding_data:/app/data
      - ./data_processing/src:/app/data_processing:ro
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - MODEL=${MODEL:-bge-m3}
      - TOKENIZER=${TOKENIZER:-BAAI/bge-m3}
      - CRON_TRIGGER_GERMAN_DATA_PROCESSING=0
      - CRON_TRIGGER_GERMAN_EMBEDDING=3
      - CRON_TRIGGER_EU_DATA_PROCESSING=1
      - CRON_TRIGGER_EU_EMBEDDING=4
      - GERMAN_COLLECTION_NAME=fundings_german
      - EU_COLLECTION_NAME=fundings_eu
      - GERMAN_EXTRACTED_FILE_PATH=data/german_parquet_data_uuid.parquet
      - GERMAN_TAXONOMY_FILE_PATH=data/taxonomy_german.json
      - EU_EXTRACTED_FILE_PATH=data/eu_parquet_data_uuid.parquet
      - GERMAN_FUNDING_DATA_URL=https://foerderdatenbankdump.fra1.cdn.digitaloceanspaces.com/data/parquet_data.zip
      - EU_API_URL=https://api.tech.ec.europa.eu/search-api/prod/rest/search
      - EU_API_KEY=${EU_API_KEY}
      - EU_PAGE_SIZE=50
      - EU_MAX_PAGES=100
      - EU_REQUEST_TIMEOUT_SECONDS=30
      - EU_PAGE_DELAY_SECONDS=0.2
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_EMBED_TIMEOUT_SECONDS=120
      - VECTOR_DB_HOST=qdrant
      - QDRANT_PORT=6333
      - RUN_STARTUP_PIPELINES_SYNC=false
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - BM25_K1=${BM25_K1:-1.2}
      - ADAPTIVE_CHUNK_THRESHOLD=${ADAPTIVE_CHUNK_THRESHOLD:-600}
      - TOPK_SCORES=${TOPK_SCORES:-3}
      - EMBEDDING_CONCURRENCY=${EMBEDDING_CONCURRENCY:-4}
    networks:
      - backend
      - frontend
      - egress
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser:uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  streamlit:
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    container_name: sefuse_streamlit
    ports:
      - "0.0.0.0:8080:8501"
    volumes:
      - ./data/funding_data:/app/data:ro
    depends_on:
      fastapi:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - MODEL=${MODEL:-bge-m3}
      - FASTAPI_URL=http://fastapi:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_CONNECT_TIMEOUT_SECONDS=${DB_CONNECT_TIMEOUT_SECONDS:-5}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      - PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH:-8}
      - SESSION_TIMEOUT_MINUTES=${SESSION_TIMEOUT_MINUTES:-30}
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser:uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

networks:
  # UI ↔ FastAPI communication. Non-internal so host port mappings work (required
  # for Streamlit's ports: binding). Streamlit makes no outbound internet calls.
  frontend:
    driver: bridge

  # FastAPI ↔ Qdrant/Postgres/Ollama communication. Internal: no outbound internet, no host access.
  backend:
    driver: bridge
    internal: true

  # Controlled outbound internet access for services that need external APIs.
  # Only FastAPI (funding data fetches) and Ollama (model pulls) are attached.
  egress:
    driver: bridge